# Dependencias del playbook
#
# El role instalacion_paquetes NO vive en este repositorio: viene dentro del
# entorno de ejecución (ver execution-environment.yml y requirements.yml).
#
# Los valores ausentes se pasan como '' y no con default(omit): omit solo vale
# en los parámetros de un módulo. En vars de un include_role llega al role
# como un texto raro (__omit_place_holder__...) que parece una versión.

- name:                                   Asegurar que las dependencias del playbook están instalado en el host
  ansible.builtin.include_role:
    name:                                 instalador_paquetes
  vars:
    paquetes:                             "{{ dependencias }}"
  tags:
          - always
# Pero... para instalar nginx, cúantas veces ejecutaba "instalacion_paquete/main.yaml"? 1
# Y para las dependencias? 1 para cada paquete que necesite instalar.
