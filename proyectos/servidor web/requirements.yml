---
# Lo que el playbook necesita y no trae ansible-core. Se instala DENTRO de la
# imagen del entorno de ejecución (execution-environment.yml), no en el
# portátil ni en AWX: así es igual en todos los sitios donde se ejecute.
#
# Todo con versión fija. Una colección o un role «a la última» hace que la
# misma imagen, construida dos días distintos, no sea la misma.
collections:
  - name:             ansible.posix          # synchronize, firewalld
    version:          "2.2.2"
  - name:             community.general      # archive, ufw
    version:          "13.5.0"
    # - name:             miempresa.paqueteria
    #  version:          "1.2.0"
    # Esto de arriba no guncionaría. Mi colección miempresa.paqueteria no está publicada en ANSIBLE - GALAXY
    # Mi colección está en un repo de git propio:
  - name:              https://github.com/IvanciniGT/coleccion-ansible-paqueteria.git
    type:              git
    version:           desa # "v1.0.0" tendrá sentido cuando saque una versión de verdad de la colección
                            # Ahora aun la tengo en pruebas.
                            # En lugar de una versión, le doy la RAMA! de la que quiero que saque el commit
                            # Tomará el último commit de esa rama.
roles: []
  # El role vive en su propio repositorio. Se fija por etiqueta, no por rama:
  # una rama se mueve y la imagen dejaría de ser reproducible.
  # Los roles los he movido a una colección
