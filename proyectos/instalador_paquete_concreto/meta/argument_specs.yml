---
# Ansible valida estos argumentos ANTES de ejecutar la primera tarea del role.
# Un operador mal escrito («=>») o un paquete vacío fallan aquí, con un mensaje
# claro, y no a mitad de un dnf con un error del gestor de paquetes.
argument_specs:
  main:
    short_description: Instala un paquete en Debian/Ubuntu o en RHEL/Rocky
    description:
      - Configura, si se le da, un repositorio con su clave, actualiza la caché
        de paquetes e instala el paquete en la versión pedida.
    options:
      paquete:
        type:         str
        required:     true
        description:  Nombre del paquete a instalar.
      version:
        type:         str
        default:      ""
        description:  Versión del paquete. Vacía instala la última disponible.
      operador_version:
        type:         str
        default:      "="
        choices:      ["=", ">=", "<=", ">", "<"]
        description:  Cómo se compara la versión instalada con la pedida.
      repositorio:
        type:         str
        default:      ""
        description:
          - URL del repositorio del que instalar. Vacía usa los oficiales.
          - En RHEL es la baseurl; en Debian/Ubuntu, la URI del repositorio.
      clave:
        type:         str
        default:      ""
        description:  URL de la clave GPG con la que se firma el repositorio.
      suite:
        type:         str
        default:      ""
        description:
          - Solo Debian/Ubuntu. Suite del repositorio.
          - Vacía usa el nombre en clave de la versión del host (noble, jammy...).
            Hay repositorios que usan uno fijo, como stable.
      componentes:
        type:         list
        elements:     str
        default:      [main]
        description:  Solo Debian/Ubuntu. Componentes del repositorio.
