---
galaxy_info:
  role_name:            instalacion_paquetes
  namespace:            ivanosuna
  author:               Iván Osuna
  description:          Instala paquetes en Debian/Ubuntu y RHEL/Rocky, con repositorio, clave y versión opcionales
  company:              Iván Osuna Ayuste — formación
  license:              MIT

  # deb822 y los operadores de versión en apt piden un ansible-core moderno.
  min_ansible_version:  "2.15"

  platforms:
    - name:             EL
      versions:
                      - "8"
                      - "9"
    - name:             Ubuntu
      versions:
                      - jammy
                      - noble
    - name:             Debian
      versions:
                      - bookworm

  galaxy_tags:
                      - paquetes
                      - apt
                      - dnf
                      - repositorios

dependencies: []
