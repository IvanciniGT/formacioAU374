---
- name:                   Asegurar que tenemos los repos del paquete configurados en el host (con sus claves)
  ansible.builtin.yum_repository:
    name:                 "{{ paquete }}"
    description:          "{{ paquete }}"
    baseurl:              "{{ repositorio }}"
    gpgcheck:             "{{ clave | length > 0 }}"
    gpgkey:               "{{ clave if clave | length > 0 else omit }}" # omit: si no hay clave, como si no hubiera escrito la línea
    # En RHEL 8 y 9 muchos paquetes (nginx entre ellos) vienen también como
    # módulos de AppStream, y dnf esconde los de cualquier otro repositorio que
    # se llamen igual. Sin esto, el repositorio queda configurado y dnf sigue
    # instalando la versión del módulo sin decir nada.
    module_hotfixes:      true
  when:                   repositorio | length > 0
                          # Cuando me han pasado repos específicos. Si tiran de repos oficiales no. -> CONDICIONAL!
  become:                 true # Necesito permisos de superusuario para poder hacer esta tarea.
                          # Mi problema no es mirar si tengo esos permisos. NECESITO ESOS PERMISOS.
                          # Cómo se convierte en superusuario (sudo, su...) es cosa de quien ejecute
                          # el playbook, en SU entorno, que es suyo y no mío.

- name:                   Asegurar que el paquete queda instalado en el host en la versión que me interesa
                          # Este es el que ejecutará el dnf
  ansible.builtin.dnf:
    # Operador ternario de Jinja: VALOR_SI_SE_CUMPLE if CONDICION else VALOR_SI_NO
    #   sin versión      -> nginx
    #   versión exacta   -> nginx-1.20.1
    #   con operador     -> nginx >= 1.20
    name:                 >-
                          {{ paquete if not version
                             else (paquete ~ '-' ~ version) if operador_version == '='
                             else (paquete ~ ' ' ~ operador_version ~ ' ' ~ version) }}
    # Con versión, latest: la más nueva que cumpla la condición. Con present,
    # si ya hay una instalada que NO la cumple (1.20 cuando se pide >= 1.26),
    # dnf la da por buena y no actualiza. latest sí actualiza.
    #
    # Y sube a la más nueva que cumpla, en cada ejecución: con >= 2.4, el día
    # que salga la 3.0 se instalará la 3.0. Para quedarse en una rama se usa
    # = con comodín: «2.4*» solo parches, «2.*» también minors.
    #
    # Sin versión, present: si nadie ha pedido una versión, no se actualiza
    # nada por el hecho de ejecutar el playbook.
    state:                "{{ 'latest' if version else 'present' }}"
    # En dnf actualizar la caché no cuenta como cambio: el módulo solo dice
    # «changed» si instala algo. Por eso aquí no hace falta el changed_when
    # que sí necesita apt.
    update_cache:         true
  become:                 true
