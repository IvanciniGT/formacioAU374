---
# El repositorio se escribe a mano en formato deb822 en lugar de usar
# deb822_repository o apt_repository: esos módulos necesitan python3-debian o
# python3-apt en el host antes de poder ejecutarse, y una imagen mínima de
# Ubuntu no los trae. Un fichero de texto y una clave descargada no necesitan
# nada, y son exactamente lo que apt lee.
- name:                   Decidir dónde se guarda la clave del repositorio
  # apt distingue el formato de la clave por la EXTENSIÓN del fichero: .asc en
  # texto (ASCII), .gpg en binario. Una clave binaria guardada como .asc la
  # ignora, y el repositorio falla con «NO_PUBKEY» como si no hubiera clave.
  ansible.builtin.set_fact:
    instalacion_paquetes_fichero_clave: "/etc/apt/keyrings/{{ paquete }}{{ '.gpg' if clave is search('\\.gpg$') else '.asc' }}"
  when:                   repositorio | length > 0 and clave | length > 0

- name:                   Asegurar que existe la carpeta de claves de apt
                          # Ubuntu 22.04 y posteriores la traen; Debian 11 y las imágenes mínimas, no siempre.
  ansible.builtin.file:
    path:                 /etc/apt/keyrings
    state:                directory
    mode:                 "0755"
  when:                   repositorio | length > 0 and clave | length > 0
  become:                 true

- name:                  Asegurar que tenemos la clave del repositorio del paquete en el host
  ansible.builtin.get_url:
    url:                  "{{ clave }}"
    dest:                 "{{ instalacion_paquetes_fichero_clave }}"
    mode:                 "0644"
  when:                   repositorio | length > 0 and clave | length > 0
  become:                 true

- name:                   Asegurar que tenemos el repositorio del paquete configurado en el host
  ansible.builtin.copy:
    dest:                 "/etc/apt/sources.list.d/{{ paquete }}.sources"
    mode:                 "0644"
    content:              |
                          # Gestionado por Ansible (role instalacion_paquetes). Los cambios a mano se pierden.
                          Types: deb
                          URIs: {{ repositorio }}
                          Suites: {{ suite if suite | length > 0 else ansible_facts.distribution_release }}
                          Components: {{ componentes | join(' ') }}
                          {% if clave | length > 0 %}
                          Signed-By: {{ instalacion_paquetes_fichero_clave }}
                          {% endif %}
  when:                   repositorio | length > 0
                          # Cuando me han pasado repos específicos. Si tiran de repos oficiales no. -> CONDICIONAL!
  register:               instalacion_paquetes_repositorio
  become:                 true

- name:                   Actualizar los repos del sistema operativo, para que nos encuentre la versión del paquete que nos han pedido
  ansible.builtin.apt:
    update_cache:         true
    # Una hora de margen: instalar diez dependencias seguidas no hace diez
    # apt update. Pero si acabamos de dar de alta un repositorio, la caché
    # vieja no lo conoce y hay que actualizar sí o sí.
    cache_valid_time:     "{{ 0 if instalacion_paquetes_repositorio is changed else 3600 }}"
  become:                 true
                          # Esta tarea siempre provocaría un CHANGED, y en la segunda ejecución
                          # veríamos que el playbook «ha cambiado cosas» sin haber tocado nada.
                          # La pregunta no es si la tarea provoca cambios... sino si nos interesa
                          # CONTROLAR esos cambios. Un apt update no es un cambio relevante.
  changed_when:           false

- name:                   Asegurar que el paquete queda instalado en el host en la versión que me interesa
                          # Este es el que ejecutará el apt
  ansible.builtin.apt:
    # En apt el operador va pegado, sin espacios:
    #   sin versión      -> nginx
    #   versión exacta   -> nginx=1.24.0-2ubuntu7   (o nginx=1.24* con comodín)
    #   con operador     -> git>=2.30
    name:                 "{{ paquete if not version else (paquete ~ operador_version ~ version) }}"
    # Con versión, latest: la más nueva que cumpla la condición. apt con
    # present ya actualiza si la instalada no cumple, pero se queda en la que
    # haya si cumple. Se usa latest para que la versión signifique lo mismo
    # aquí que en RedHat, donde present ni siquiera actualiza.
    #
    # Y sube a la más nueva que cumpla, en cada ejecución: con >= 2.4, el día
    # que salga la 3.0 se instalará la 3.0. Para quedarse en una rama se usa
    # = con comodín: «2.4*» solo parches, «2.*» también minors.
    #
    # Sin versión, present: si nadie ha pedido una versión, no se actualiza
    # nada por el hecho de ejecutar el playbook.
    state:                "{{ 'latest' if version else 'present' }}"
  become:                 true
