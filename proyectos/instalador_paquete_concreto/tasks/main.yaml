---
# El role no puede dar por hecho que quien lo llama ha recogido los facts: un
# playbook con gather_facts: false es lo normal, y lo correcto. Así que, si no
# sabe en qué familia de sistema operativo está, lo pregunta él. Solo eso: un
# gather_facts completo tarda, y aquí no hace falta nada más.
- name:                                     Averiguar la FAMILIA del sistema operativo, si nadie lo ha hecho ya
  ansible.builtin.setup:
    gather_subset:
                                          - "!all"
                                          - "!min"
                                          - distribution
  when:                                     ansible_facts.os_family is not defined
  # Imperativo. CONDICIONAL
  tags:
                                          - always

- name:                                     Comprobar que la familia del sistema operativo está soportada por el role
  ansible.builtin.assert:
    that:
                                          - ansible_facts.os_family | lower in instalacion_paquetes_familias
    fail_msg:                               >-
                                             El role instalacion_paquetes no sabe instalar en
                                             {{ ansible_facts.os_family }}. Soporta: {{ instalacion_paquetes_familias | join(', ') }}
    quiet:                                  true
  vars:
    instalacion_paquetes_familias:
                                          - debian
                                          - redhat
  tags:
                                          - always

- name:                                     Asegurar que un paquete queda instalado en la versión que me interesa
  ansible.builtin.include_tasks:
    file:                                   "{{ ansible_facts.os_family | lower }}/instalar.yaml"
    # En una plantilla jinja, lo que no va entre {{}} se interpreta como texto literal.
    # lo que ponemos entre {{}} se interpreta como una expresión Jinja que se evalúa en tiempo de ejecución.
    # Esa expresión puede ser :
    # - Una variable:  {{ familia_sistema_operativo }}
    # - Una expresión:  {{ familia_sistema_operativo == 'debian' }}
    # - Una variable con un filtro de Jinja:  {{ 'hola' | upper }}
    #
    # Las tareas del role van todas con `always`: si me han incluido, hago el
    # trabajo entero. Qué etiquetas filtran la instalación lo decide quien me
    # llama, en su include_role, no yo.
    apply:
      tags:
                                          - always
  tags:
                                          - always
