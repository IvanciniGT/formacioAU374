---
# defaults file for instalador_paquete
# Este archivo sirve a 2 propósitos:
# 1. Definir / dar valores por defecto a los argumentos del role.
# 2. Servir de plantilla para quien usar nuestro role, mostrando la estructura esperada y los valores por defecto.
paquete:
  nombre:               ~         # El paquete que se desea instala. Ejemplo: "nginx"
  # version:
  #        name:         ~        # La version a instalar del paquet. Ejemplo "1.18.0"
                                  # Si no se pasa valor, se instalará la última versión disponible.
  #        operator:     "="      # Operador de comparación para la versión. Ejemplo: ">=", "<=", "=", etc.
                                  # Si no se pasa valor, se usará el operador por defecto "=
  # Información particular pàra cada una de las distros soportadas. Nuestro role soporta solo "debian" y "redhat".
  # redhat:
        # version:                                                                # Si no se suministra versión se usará la versión por defecto del paquete en redhat
        #       name:         <pon aquí la versión específica de redhat>          # Versión específica del paquete para redhat
        #       operator:     "<pon aquí el operador específico de redhat>"       # Operador de comparación para la versión específica del paquete en redhat
        # repo:                                                                   # Repositorio específico para redhat
        #        url:          <pon aquí la URL del repo>                         # Si no se suministra, se usará el repositorio oficial
        #        key:          <pon aquí tu clave del repo>                       # Si no se pasa, no se configura clave.
  # debian:
        # version:                                                                # Si no se suministra versión se usará la versión por defecto del paquete en debian
        #       name:         <pon aquí la versión específica de debian>          # Versión específica del paquete para debian
        #       operator:     "<pon aquí el operador específico de debian>"       # Operador de comparación para la versión específica del paquete en debian
        # repo:                                                                   # Repositorio específico para debian
        #        url:          <pon aquí la URL del repo>                         # Si no se suministra, se usará el repositorio oficial
        #        key:          <pon aquí tu clave del repo>                       # Si no se pasa, no se configura clave.
        #        suite:        <pon aquí la suite del repo>                       # Si no se pasa, se usa el nombre en clave de la distro (ansible_distribution_release). Ejemplo: "noble"
        #        components:                                                      # Si no se pasan, se usa "main"
        #          - <pon aquí cada componente del repo>                          # Ejemplo: "nginx"

# Ejemplos
#
# Ejemplo 1: Instalar una versión específica de nginx de repos oficiales
# paquete:
#   nombre: "nginx"
#   version:
#           name: "1.18.0"
#           operator: "="
#
# Ejemplo 2: Instalar cualquier verisón de curl
# paquete:
#   nombre: "curl"
#
# Ejemplo 3: Instalar una versión específica de nginx de repos específicos
# paquete:
#   nombre: "nginx"
#   version:
#           name: "1.18.0"
#           operator: "="
#   redhat:
#        repo:
#               url: "http://example.com/repo"
#               key: "http://example.com/repo.key"
#
# Ejemplo 4: Instalar nginx desde los repos oficiales de nginx.org, con versión y repo propios para cada distro
#            (usa todos los campos que admite el role)
# paquete:
#   nombre: "nginx"
#   version:                                    # Versión genérica: se usa si la distro no trae la suya
#           name: "1.26.2"
#           operator: ">="
#   redhat:
#        version:
#               name: "1.26.2-1.el9.ngx"        # Así numera nginx.org sus RPM para RHEL 9 / Rocky 9
#               operator: ">="                  # dnf sí entiende rangos: "nginx >= 1.26.2-1.el9.ngx"
#        repo:
#               url: "https://nginx.org/packages/rhel/$releasever/$basearch/"
#               key: "https://nginx.org/keys/nginx_signing.key"
#   debian:                                     # Ubuntu también cae aquí: Ansible lo clasifica en la familia Debian
#        version:
#               name: "1.26.2-1~noble"          # Así numera nginx.org sus .deb para Ubuntu 24.04 (noble)
#               operator: "="                   # apt solo fija versiones exactas: "nginx=1.26.2-1~noble"
#        repo:
#               url: "https://nginx.org/packages/ubuntu"
#               key: "https://nginx.org/keys/nginx_signing.key"
#               suite: "noble"                  # Línea resultante: "deb https://nginx.org/packages/ubuntu noble nginx"
#               components:
#                 - "nginx"
