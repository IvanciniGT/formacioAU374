---
# tasks file for instalador_paquete

- name:                               Obtener la distribución de sistema operativo si no se ha obtenido previamente
  ansible.builtin.setup:
    gather_subset:
                                    - "!all"
                                    - "!min"
                                    - "distribution"
  when:                               ansible_facts['distribution'] is not defined
  tags:
    - always

- name:                               Normalizar la información de la distribución
  ansible.builtin.set_fact:
    ansible_facts:
      distribucion_normalizada:       "{{ ansible_facts.os_family | lower }}"
  tags:
    - always

- name:                               Comprobar que la familia del sistema operativo está soportada por el role
  ansible.builtin.assert:
    that:
                                    - distribucion_normalizada in distribuciones_soportadas_por_el_role
    fail_msg:                       >-
                                      El role instalacion_paquetes no sabe instalar en
                                      {{ ansible_facts.os_family }}. Soporta: {{ distribuciones_soportadas_por_el_role | join(', ') }}
    quiet:                            true
  tags:
                                    - always

- name:                               Determnino la información concreta del paquete a instalar dependiendo de la distribución
  ansible.builtin.set_fact:
    paquete_concreto:                 "{{ paquete | combine(paquete[distribucion_normalizada] | default({}, true) | limpiar_nulos, recursive=true) }}"
  tags:
    - always
                                      # Mi variable ahora tiene esta pinta:
                                      # paquete_concreto tiene esta pinta:
                                      #     nombre: "nginx"
                                      #     version:
                                      #            name: "1.26.2-1.el9.ngx"
                                      #            operator: ">="
                                      #     repo:
                                      #            url: "https://nginx.org/packages/rhel/$releasever/$basearch/"
                                      #            key: "https://nginx.org/keys/nginx_signing.key"
                                      # También viene dentro : redhat o debian dependiendo de la distribución del host...
                                      # pero ya de esos datos pas (los ignoro)

- name:                               Llamar al Role que instala el paquete solicitado con los datos adecuados
  ansible.builtin.include_role:
    name:                             instalador_paquete_concreto
  vars:
      paquete:                        "{{ paquete_concreto.nombre }}"
      version:                        "{{ paquete.version.name | default(omit, true) }}"
                                                              # omit: Si no se especifica, ansible no pasa la variable "version" al role
      operador_version:               "{{ paquete.version.operator | default(omit, true) }}"
      repositorio:                    "{{ paquete.repo.url | default(omit, true) }}"
      clave:                          "{{ paquete.repo.key | default(omit, true) }}"          # URL de la clave GPG del repositorio
      suite:                          "{{ paquete.repo.suite | default(omit, true) }}"          # Solo Debian/Ubuntu. Vacía: la de la versión del host (noble, jammy...)
      componentes:                    "{{ paquete.repo.componentes | default(omit, true) }}"          # Solo Debian/Ubuntu: componentes del repositorio
  tags:
    - always
